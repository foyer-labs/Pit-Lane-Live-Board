name: CI

# The main branch holds only the published integration: here run the two checks
# HACS requires. Tests, lint and the frontend build run on develop.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
