[project]
name = "pit-lane-live-board"
version = "0.1.0"
description = "Formula 1 in a ready-made Home Assistant panel (unofficial)"
license = "Apache-2.0"
requires-python = ">=3.13"

[tool.pytest.ini_options]
# The default run is the pure suite: no Home Assistant needed. tests/ha runs in its
# own CI job with pytest-homeassistant-custom-component.
testpaths = ["tests/core", "tests/repo"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = ["frontend/node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "ASYNC"]
ignore = [
    "PLR2004",  # literal values are normal in tests and in F1's status codes
    "PLC0415",  # imports inside functions keep the pure suite free of Home Assistant
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true
