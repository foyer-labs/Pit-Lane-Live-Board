<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bench: Pit Lane Live Board</title>
</head>
<body>
<!--
  The real panel with a fake hass (bench/hass.js). Serve the repository root:
    python -m http.server 8777
  then open http://127.0.0.1:8777/bench/?page=live&lang=it&theme=dark
  Data: python scripts/bench_data.py (git-ignored bench/data/).
  Extra: round=14&tab=strategy opens a Results detail.
-->
<script type="module">
  const params = new URLSearchParams(location.search);
  const { createHass, applyTheme } = await import("./hass.js");
  applyTheme();
  try { localStorage.setItem("pit-lane-live-board-page", params.get("page") ?? "live"); } catch {}
  await import(`../custom_components/pit_lane_live_board/frontend/pit-lane-live-board-panel.js?${Math.random()}`);
  const panel = document.createElement("pit-lane-live-board-panel");
  panel.narrow = innerWidth < 870;
  document.body.append(panel);
  panel.hass = createHass();
  if (params.get("round")) {
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    for (let i = 0; i < 50; i++) {
      const results = panel.shadowRoot?.querySelector("plb-results");
      if (results?.rounds) {
        const round = results.rounds.find((r) => r.round === Number(params.get("round")));
        if (round) {
          results.open(round);
          await wait(50);
          if (params.get("tab")) results.tab = params.get("tab");
        }
        break;
      }
      await wait(100);
    }
  }
  if (params.get("delayOpen") === "true") panel.delayOpen = true;
</script>
</body>
</html>
