<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Bench: Pit Lane Live Board</title>
</head>
<body>
<!--
  The real panel with a fake hass (bench/hass.js). Serve the repository root:
    python -m http.server 8777
  then open http://127.0.0.1:8777/bench/?page=live&lang=it&theme=dark
  Data: python scripts/bench_data.py (git-ignored bench/data/).
  Extra: round=14&tab=strategy opens a Results detail; select=16 selects a driver;
  page=circuit&circuit=baku&driver=leclerc opens a circuit's history and a driver's years.
-->
<script type="module">
  const params = new URLSearchParams(location.search);
  const { createHass, applyTheme } = await import("./hass.js");
  applyTheme();
  try { localStorage.setItem("pit-lane-live-board-page", params.get("page") ?? "live"); } catch {}
  await import(`../custom_components/pit_lane_live_board/frontend/pit-lane-live-board-panel.js?${Math.random()}`);
  const panel = document.createElement("pit-lane-live-board-panel");
  panel.narrow = innerWidth < 870;
  document.body.append(panel);
  const hass = createHass();
  try { hass.states = await (await fetch("./data/states.json", { cache: "no-store" })).json(); } catch {}
  panel.hass = hass;
  if (params.get("round")) {
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    for (let i = 0; i < 50; i++) {
      const results = panel.shadowRoot?.querySelector("plb-results");
      if (results?.rounds) {
        const round = results.rounds.find((r) => r.round === Number(params.get("round")));
        if (round) {
          results.open(round);
          await wait(50);
          if (params.get("tab")) results.tab = params.get("tab");
        }
        break;
      }
      await wait(100);
    }
  }
  if (params.get("page") === "circuit") {
    // A circuit's history (circuit=baku): opened as the Calendar's link opens it;
    // driver=leclerc opens that driver's years.
    for (let i = 0; i < 50 && !panel.settings; i++) await new Promise((r) => setTimeout(r, 100));
    const circuit = params.get("circuit") ?? "baku";
    panel.go({ page: "circuit", circuit_id: circuit, circuit: circuit === "baku" ? "Baku City Circuit" : circuit, from: "calendar" });
    if (params.get("driver")) {
      for (let i = 0; i < 50; i++) {
        const circuit = panel.shadowRoot?.querySelector("plb-circuit");
        const driver = circuit?.data?.drivers.find((d) => d.driver_id === params.get("driver"));
        if (driver) { circuit.toggle(driver); break; }
        await new Promise((r) => setTimeout(r, 100));
      }
    }
  }
  if (params.get("delayOpen") === "true") panel.delayOpen = true;
  if (params.get("select")) {
    for (let i = 0; i < 50; i++) {
      const live = panel.shadowRoot?.querySelector("plb-live");
      if (live?.view) { live.selected = params.get("select"); break; }
      await new Promise((r) => setTimeout(r, 100));
    }
  }
</script>
</body>
</html>
